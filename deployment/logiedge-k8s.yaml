apiVersion: v1
kind: Service
metadata:
  name: mosquitto-broker
spec:
  selector:
    app: mosquitto
  ports:
    - protocol: TCP
      port: 1883
      targetPort: 1883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:latest
        ports:
        - containerPort: 1883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logiedge-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logiedge-inference
  template:
    metadata:
      labels:
        app: logiedge-inference
    spec:
      containers:
      - name: inference
        image: logiedge_inference:latest
        imagePullPolicy: Never  # Forces k8s to use the locally loaded image
        env:
        - name: MQTT_BROKER
          value: "mosquitto-broker"
        - name: MODEL_PATH
          value: "/opt/logibridge/model.tflite"